<!doctype html>
<html><meta charset="utf-8"><title>Native child shell</title>
<body style="margin:0;background:transparent"><script>
(() => {
  "use strict";
  let iframe;
  let frameHtml;
  let frameLoadStarted = false;

  window.__armProbe = nonce => {
    if (iframe) throw new Error("Probe iframe can only be created once");
    iframe = document.createElement("iframe");
    iframe.id = "probe-frame";
    iframe.setAttribute("sandbox", "allow-scripts allow-popups");
    iframe.style.cssText = "width:100%;height:100%;border:0;background:transparent";
    frameHtml = `<!doctype html><html><meta charset="utf-8"><body><script>
      (() => {
        "use strict";
        const nonce = ${JSON.stringify(nonce)};
        const selfTauriUnavailable = typeof window.__TAURI_INTERNALS__ === "undefined"
          && typeof window.__TAURI__ === "undefined";
        let tauriInternalsDenied = false;
        try { void window.top.__TAURI_INTERNALS__; }
        catch (_) { tauriInternalsDenied = true; }
        window.addEventListener("load", () => window.parent.postMessage({
          kind: "iframe-ready", nonce, locationOrigin: window.location.origin,
          tauriInternalsDenied, selfTauriUnavailable
        }, "*"), { once: true });
        window.addEventListener("message", event => {
          if (event.data?.kind !== "probe-port" || event.data?.nonce !== nonce) return;
          const parentSourceMatched = event.source === window.parent;
          if (!parentSourceMatched || event.ports.length !== 1) return;
          event.ports[0].postMessage({
            kind: "typed-array-roundtrip", nonce, parentSourceMatched,
            bytes: new Uint8Array([0, 1, 127, 128, 255])
          });
        });
      })();
    <\/script></body></html>`;

    // Forward the original trusted MessageEvent; do not synthesize sender data.
    window.addEventListener("message", event => {
      if (event.source !== iframe.contentWindow || event.origin !== "null" || !event.isTrusted) return;
      if (typeof window.opener?.__receiveFrameEvent === "function") {
        window.opener.__receiveFrameEvent(event);
      }
    });
    window.__postToFrame = (message, transfer = []) => {
      if (!iframe.contentWindow) throw new Error("Probe iframe is unavailable");
      iframe.contentWindow.postMessage(message, "*", transfer);
    };
    document.body.appendChild(iframe);
    return iframe;
  };

  window.__loadProbeFrame = () => {
    if (!iframe || frameLoadStarted) throw new Error("Probe iframe load can only start once");
    frameLoadStarted = true;
    iframe.srcdoc = frameHtml;
  };

  if (window.opener) {
    window.opener.postMessage({ kind: "child-ready" }, "atools-native-probe://localhost");
  }
})();
</script></body></html>
