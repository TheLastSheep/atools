name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - name: Run cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log || {
            diagnostic="$(tail -n 60 clippy.log)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Clippy diagnostics::$diagnostic"
            exit 1
          }
      - run: cargo test --workspace
      - name: Run pnpm test:fast
        shell: bash
        run: |
          set -o pipefail
          pnpm test:fast 2>&1 | tee test-fast.log || {
            diagnostic="$(tail -n 60 test-fast.log)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Fast-tier diagnostics::$diagnostic"
            exit 1
          }
      - name: Verify compressed-runtime release profile contract without signing inputs
        run: |
          pnpm test:node-runtime-compressed-payload
          pnpm test:node-runtime-compressed-bundle
      - run: pnpm check

  browser-and-desktop:
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm test:browser
        shell: bash
        run: |
          set -o pipefail
          pnpm test:browser 2>&1 | tee test-browser.log || {
            diagnostic="$(tail -n 60 test-browser.log)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Browser-tier diagnostics::$diagnostic"
            exit 1
          }
      - name: Run pnpm test:desktop
        shell: bash
        env:
          ATOOLS_DESKTOP_SMOKE_TIMEOUT_MS: 600000
        run: |
          set -o pipefail
          pnpm test:desktop 2>&1 | tee test-desktop.log || {
            # Cargo's in-place progress lines can consume GitHub's annotation
            # limit before the actual desktop smoke failure is reached. Keep
            # only the application/runtime tail and strip terminal escapes.
            diagnostic="$(
              tr '\r' '\n' < test-desktop.log |
                perl -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g' |
                sed -E 's/^(ATOOLS_DESKTOP_SMOKE ).*/\1<snapshot omitted; validation result follows>/' |
                awk '/Running `.*target\/debug\/atools`/ { runtime = 1 } runtime' |
                tail -n 24
            )"
            if [ -z "$diagnostic" ]; then
              diagnostic="$(
                tr '\r' '\n' < test-desktop.log |
                  perl -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g' |
                  sed -E 's/^(ATOOLS_DESKTOP_SMOKE ).*/\1<snapshot omitted; validation result follows>/' |
                  tail -n 24
              )"
            fi
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Desktop-tier diagnostics::$diagnostic"
            exit 1
          }

  release-readiness:
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check:macos:unsigned

  performance-evidence:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record 10k and 100k search latency evidence
        run: pnpm benchmark:search:ci
      - name: Upload reproducible performance report
        uses: actions/upload-artifact@v7
        with:
          name: search-performance-${{ github.sha }}
          path: artifacts/performance/search-index.json
          if-no-files-found: error
          retention-days: 30

  database-performance-evidence:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: database-performance
      - run: pnpm install --frozen-lockfile
      - name: Record TaskRun and Memory growth evidence
        run: pnpm benchmark:database:ci
      - name: Upload reproducible database report
        uses: actions/upload-artifact@v7
        with:
          name: database-performance-${{ github.sha }}
          path: artifacts/performance/database-growth.json
          if-no-files-found: error
          retention-days: 30

  runtime-performance-evidence:
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: runtime-performance
      - run: pnpm install --frozen-lockfile
      - name: Prepare raw developer-profile Node runtime for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$target"
          node scripts/prepare-node-runtime.mjs --target "$target"
      - name: Stage and pin built-in plugin resources for bundle measurement
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc -vV | sed -n 's/^host: //p')"
          stage_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$target" in
            aarch64-apple-darwin) arch=arm64 ;;
            x86_64-apple-darwin) arch=x64 ;;
            *) echo "Unsupported Node bundle target: $target" >&2; exit 1 ;;
          esac
          node scripts/prepare-builtin-runtime-resources.mjs --write --apply-candidate-rules \
            --output "target/builtin-runtime-staging/$stage_id/$target" --target-platform darwin --target-arch "$arch"
      - name: Exercise staged PDF merge inputs
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$(pwd -P)"
          runner_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          stage_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          staged_root="$repo_root/target/builtin-runtime-staging/$stage_id/$target"
          pdf_temp_parent=""
          pdf_temp_identity=""
          cleanup_pdf_temp() {
            status=$?
            trap - EXIT
            if [[ -z "$pdf_temp_parent" ]]; then exit "$status"; fi
            case "$pdf_temp_parent" in
              "$runner_temp"/atools-pdf-stage-smoke.*) ;;
              *) echo "PDF smoke cleanup path escaped runner temp" >&2; if [[ "$status" -eq 0 ]]; then status=1; fi; exit "$status" ;;
            esac
            if [[ -L "$pdf_temp_parent" || ! -d "$pdf_temp_parent" ]]; then
              echo "PDF smoke cleanup refused a replaced temporary directory" >&2
              if [[ "$status" -eq 0 ]]; then status=1; fi
              exit "$status"
            fi
            if ! current_identity="$(stat -f '%d:%i:%u:%Lp' "$pdf_temp_parent" 2>/dev/null)"; then
              current_identity=""
            fi
            if [[ -z "$pdf_temp_identity" || "$current_identity" != "$pdf_temp_identity" ]]; then
              echo "PDF smoke cleanup refused an unverified temporary directory" >&2
              if [[ "$status" -eq 0 ]]; then status=1; fi
              exit "$status"
            fi
            if ! rm -rf "$pdf_temp_parent"; then
              echo "PDF smoke temporary directory cleanup failed" >&2
              if [[ "$status" -eq 0 ]]; then status=1; fi
            fi
            exit "$status"
          }
          pdf_temp_parent="$(mktemp -d "$runner_temp/atools-pdf-stage-smoke.XXXXXX")"
          if ! pdf_temp_identity="$(stat -f '%d:%i:%u:%Lp' "$pdf_temp_parent")"; then
            if [[ ! -L "$pdf_temp_parent" && -d "$pdf_temp_parent" ]]; then
              rmdir "$pdf_temp_parent" || echo "Could not remove empty PDF smoke temp directory" >&2
            fi
            exit 1
          fi
          trap cleanup_pdf_temp EXIT
          node scripts/test-builtin-runtime-staging-pdf.mjs --staged-root "$staged_root" --owned-temp-parent "$pdf_temp_parent"
      - name: Build raw Node developer-profile app for diagnostic measurement
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc -vV | sed -n 's/^host: //p')"
          stage_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/prepare-node-runtime-benchmark-config.mjs --target "$target" --stage-id "$stage_id" \
            > "$RUNNER_TEMP/tauri.node-runtime-benchmark.conf.json"
          pnpm tauri build --bundles app --config "$RUNNER_TEMP/tauri.node-runtime-benchmark.conf.json"
          app_path="$PWD/target/release/bundle/macos/ATools 3.0.app"
          if [[ ! -d "$app_path" ]]; then
            app_path="$PWD/src-tauri/target/release/bundle/macos/ATools 3.0.app"
          fi
          test -d "$app_path"
          node scripts/verify-builtin-runtime-bundle.mjs --app "$app_path" --target "$target"
          node scripts/verify-node-runtime-bundle.mjs --app "$app_path" --target "$target"
          echo "ATOOLS_RUNTIME_BENCHMARK_APP=$app_path" >> "$GITHUB_ENV"
      - name: Record package, launch, and resource evidence
        shell: bash
        run: |
          set -o pipefail
          pnpm run benchmark:runtime:ci -- --app "$ATOOLS_RUNTIME_BENCHMARK_APP" 2>&1 | tee runtime-performance.log || {
            diagnostic="$(tail -n 80 runtime-performance.log)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Runtime performance diagnostics::$diagnostic"
            exit 1
          }
      - name: Upload reproducible runtime report
        if: always() && hashFiles('artifacts/performance/macos-runtime.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: macos-runtime-performance-${{ github.sha }}
          path: artifacts/performance/macos-runtime.json
          if-no-files-found: error
          retention-days: 30
